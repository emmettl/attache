<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Attaché">
  <!-- An attaché case: the other meaning of the name.
       The lid seam is load-bearing. Without it, a rounded body under a handle reads as a
       padlock — which says "security", the wrong thing entirely for a config reader. The
       seam and the flat, square-shouldered handle are what make it a case.
       This is the SMALL mark: clasp only, no routing fan. It holds at 16px, where the fan
       in logo.svg turns to mush. -->
  <rect width="32" height="32" rx="7.5" fill="#1c2333"/>
  <path d="M12.6 11.2V9.9a1.6 1.6 0 0 1 1.6-1.6h3.6a1.6 1.6 0 0 1 1.6 1.6v1.3"
        fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linejoin="round"/>
  <rect x="3.6" y="11.2" width="24.8" height="13.4" rx="2.2" fill="#7dd3fc"/>
  <path d="M3.6 16.4H28.4" stroke="#1c2333" stroke-width="1.6"/>
  <rect x="13.7" y="14.7" width="4.6" height="3.4" rx="1.1" fill="#1c2333"/>
</svg>
