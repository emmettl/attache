name: Publish

# Nothing here fires on a push. Publishing happens when a GitHub Release is published —
# a deliberate act — or when somebody runs this by hand, which defaults to a dry run.
#
# That is on purpose. A workflow that publishes on merge to main means every merge is a
# release whether you meant it or not, and `npm unpublish` is heavily restricted after 72
# hours: a bad version is effectively permanent. The remedy for a mistake is a new version
# with the broken one sitting on the registry forever, so the trigger should be something
# you had to go and do.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build and check everything, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the attestation is signed with a short-lived OIDC token
  # rather than anything stored in the repo.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Still needed with trusted publishing: it writes the .npmrc that points npm at
          # the public registry. The auth line in it goes unused, because there is no
          # token any more — npm exchanges the workflow's OIDC identity instead.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later, and which npm a Node release bundles
      # is not something to find out from a failed release. Checked rather than upgraded
      # blindly, so the log says what the runner actually had.
      - name: Check npm is new enough for OIDC
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          if [ "$(printf '11.5.1\n%s\n' "$(npm --version)" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::notice::npm $(npm --version) predates trusted publishing — upgrading"
            npm install -g npm@^11.5.1
            echo "now npm $(npm --version)"
          fi

      - run: npm ci

      # `npm test` includes the browser project, so the release needs a Chromium the same way
      # CI does. Without it the publish fails at the one step that exists to stop a broken
      # release, which would be an unusually expensive way to find out.
      - run: npx playwright install --with-deps chromium

      # The full check, before anything leaves the machine. Publishing something that
      # does not lint, type-check or pass its tests is the one failure this workflow
      # exists to prevent — CI on main can go red after a merge, and the release would
      # otherwise sail past it.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Guards against the commonest release mistake: cutting v0.2.0 having forgotten to
      # bump any package, and silently republishing — or failing to publish — 0.1.0.
      # Deliberately not a lockstep requirement: the packages version independently, so
      # this only asks that the tag matches SOMETHING.
      - name: Check the release tag matches a package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(node -p "require('./packages/core/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          APP=$(node -p "require('./packages/app/package.json').version")
          echo "tag=$TAG core=$CORE cli=$CLI app=$APP"
          if [ "$TAG" != "$CORE" ] && [ "$TAG" != "$CLI" ] && [ "$TAG" != "$APP" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME matches none of @attache/core ($CORE), @attache/cli ($CLI) or @attache/app ($APP). Bump a package, or retag."
            exit 1
          fi

      # Everything below this line asks one question: can EVERY package be published?
      # It is asked before any of them is, because the publish loop runs under `set -e` and
      # publishing is not a transaction. A package that cannot go out takes down every
      # package after it in the loop and leaves the ones before it on the registry —
      # @attache/core at 0.4.0, @attache/cli absent, @attache/app never attempted — and
      # `npm unpublish` is heavily restricted after 72 hours, so that state is close to
      # permanent. The remedy would be 0.4.1 for the two that failed, with a 0.4.0 core
      # sitting there forever alongside a CLI that never had one.
      #
      # The check is cheap and the failure it prevents is not, so it runs on dry runs too:
      # `workflow_dispatch` with dry_run is the rehearsal, and a rehearsal that skips the
      # step most likely to fail is not rehearsing the release.
      - name: Check every package can actually be published
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          missing=()
          for pkg in core cli app; do
            name=$(node -p "require('./packages/$pkg/package.json').name")

            if out=$(npm view "$name" versions --json 2>&1); then
              continue
            fi

            # An E404 means the package genuinely is not on the registry. Anything else —
            # an outage, a proxy, a rate limit — must not be read as "brand new", because
            # the two call for opposite responses: one needs a credential added, the other
            # needs a retry in ten minutes. Guessing wrong here either blocks a release
            # that was fine or waves through the one this step exists to stop.
            if ! printf '%s' "$out" | grep -q 'E404'; then
              echo "::error::Could not ask the registry about $name, and the answer decides whether this release can proceed. npm said: $out"
              exit 1
            fi

            echo "::notice::$name is not on the registry yet — this release would be its first."
            missing+=("$name")
          done

          # The one case that needs a credential. npm will not let a trusted publisher be
          # configured for a package that does not exist (see the note on the publish step),
          # so a brand-new package's first version cannot go out over OIDC. Without this
          # check that arrives as a 404 from `npm publish` halfway down the loop.
          if [ ${#missing[@]} -gt 0 ] && [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::${missing[*]} — not on the registry, and no NPM_TOKEN is set. A trusted publisher cannot be configured for a package that does not exist yet, so the first version of a new package has to be published with a credential. Add the NPM_TOKEN secret and re-run this release; then configure the trusted publisher for it on npmjs.com and delete the secret again."
            exit 1
          fi

          # @attache/cli pins @attache/core to an exact version rather than a range, which
          # is the right pin for two packages released together and the wrong one to get
          # subtly out of step: bump the CLI, forget the core, and the CLI publishes fine
          # and is then uninstallable, because the version it asks for does not exist. That
          # failure surfaces on a stranger's `npx`, not in this workflow, which is why it is
          # checked here.
          PIN=$(node -p "require('./packages/cli/package.json').dependencies['@attache/core']")
          CORE=$(node -p "require('./packages/core/package.json').version")
          if [ "$PIN" != "$CORE" ] && ! npm view "@attache/core@$PIN" version > /dev/null 2>&1; then
            echo "::error::@attache/cli depends on @attache/core@$PIN, which is neither the version in this repo ($CORE, which this release would publish) nor already on the registry. Installing the CLI would fail to resolve. Line the two up before releasing."
            exit 1
          fi

      # Two ways to authenticate, and which one runs is decided by whether the NPM_TOKEN
      # secret exists. That is deliberate: it makes switching between them a matter of
      # adding or deleting a secret, with no second edit to this file to forget.
      #
      # TRUSTED PUBLISHING (the destination) is the tokenless one. npm trades the
      # `id-token: write` identity above for a short-lived credential, so there is no
      # long-lived secret in the repo to leak, rotate or forget.
      #
      # A TOKEN is needed exactly once, to get there. npm will not let you configure a
      # trusted publisher for a package that does not exist yet — the settings page needs
      # something to attach to — and `npm trust` does not help, because it has the same
      # requirement AND refuses granular tokens that bypass 2FA. So the first version of a
      # brand-new package has to be pushed with a credential, and every version after it
      # can be OIDC.
      #
      # AFTER THE FIRST RELEASE: configure the trusted publisher on npmjs.com for every
      # package, then DELETE the NPM_TOKEN secret. Deleting it is the whole switch. Do not
      # leave it sitting there once trusted publishing is on — npm prefers an explicit
      # token over OIDC, so the day that token expires or is revoked it stops being
      # redundant and starts being the reason a release returns 401.
      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is set — publishing with a token (bootstrap mode). Remove the secret once trusted publishing is configured."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into
            # ~/.npmrc whether or not a token exists. With no token that line expands to an
            # EMPTY credential, and npm presents it rather than falling through to the OIDC
            # exchange — an empty string is still an answer to "do you have a token?".
            # Removing the line leaves npm with no credential at all, which is the state
            # trusted publishing is looking for.
            echo "::notice::No NPM_TOKEN — publishing via OIDC trusted publishing."
            sed -i '/_authToken/d' "$HOME/.npmrc" 2>/dev/null || true
          fi

          published_any=0

          for pkg in core cli app; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")

            # Already on the registry? Skip rather than fail. The packages are released
            # together but version independently, so a release that only touches the core
            # will find the others unchanged — and that is not an error.
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "::notice::$name@$version is already published — skipping"
              echo "- \`$name@$version\` — already published, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "Dry run: $name@$version"
              npm publish --workspace "$name" --provenance --dry-run
              echo "- \`$name@$version\` — dry run, not published" >> "$GITHUB_STEP_SUMMARY"
            else
              # --provenance attaches a signed attestation linking this tarball to this
              # commit and this workflow run. The same id-token: write that signs it is
              # what authenticates the publish now, so the permission carries both jobs.
              # access is public via publishConfig in each package.json.
              npm publish --workspace "$name" --provenance
              echo "- \`$name@$version\` — published" >> "$GITHUB_STEP_SUMMARY"
              published_any=1
            fi
          done

          if [ "$published_any" = "0" ] && [ "${DRY_RUN:-false}" != "true" ]; then
            echo "::warning::Nothing was published — every version was already on the registry."
          fi
